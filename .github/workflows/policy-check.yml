# Policy-as-code gate: every policy denies insecure and allows hardened,
# hardened has no public ingress / :latest / ACR admin. Runs on every PR.
name: policy-check

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Policy fixture tests
        run: python3 tests/run_tests.py

      - name: Hardened posture
        run: |
          grep -q "external: false" hardened/main.bicep
          grep -q "adminUserEnabled: false" hardened/main.bicep
          grep -q "keyVaultUrl" hardened/main.bicep
          grep -q "minReplicas: 1" hardened/main.bicep
          if grep -q ":latest" hardened/main.bicep; then echo "::error::no :latest in hardened"; exit 1; fi
          echo "Hardened posture OK"
