# OIDC-only deploys: no stored Azure secret in GitHub.
# Required repo variables (Settings > Secrets and variables > Actions > Variables):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, BUDGET_EMAIL
# The federated credential must trust this repo + branch (main).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  RG: rg-aca-ref
  LOC: westeurope

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build Bicep
        run: az bicep build --file bicep/main.bicep --stdout > main.json

      - name: What-if
        run: az deployment group create -g "$RG" -f bicep/main.bicep -p location="$LOC" budgetEmail="${{ vars.BUDGET_EMAIL }}" --what-if

      - name: Deploy
        run: az deployment group create -g "$RG" -f bicep/main.bicep -p location="$LOC" budgetEmail="${{ vars.BUDGET_EMAIL }}"
